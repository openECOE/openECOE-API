version: '3'
services:
  db:
    extends:
      file: .docker/docker-compose.persistence.yml
      service: db
  redis:
    extends:
      file: .docker/docker-compose.persistence.yml
      service: redis
  api:
    build: 
      context: ..
      target: prod
    image: openecoe/api:latest
    ports:
      - 8081:5000
    environment: &api-env
      OPENECOE_SECRET: eiQuain4_aelohKa3_giGh6Fai_reeTh6Ai_Aegeic6l_ekuigo0M_aeph6Qua_uuZaac5n
      OPENECOE_DB_HOST: db
      OPENECOE_DB_PORT: 3306
      OPENECOE_DB_USER: openecoe
      OPENECOE_DB_PASSWORD: openecoe
      OPENECOE_DB_NAME: openECOE_dev
      OPENECOE_REDIS_HOST: redis
      OPENECOE_REDIS_PORT: 6379
      OPENECOE_REDIS_DB: 0
      OPENECOE_CHRONO_URL: http://chrono:5001
      
      # Usuario por defecto creado la primera vez
      EMAIL: ecoe@umh.es
      PASSWORD: Kui0chee
      FIRSTNAME: Open
      SURNAME: ECOE
      ORGANIZATION: UMH
      ALEMBIC_UPGRADE: DO

      # Configruación debug
      DEBUG: "True"
      LOG_TO_STDOUT: "True"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/backend/status/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  # Cronómetro (un solo proceso; websocket en /socket.io) y trabajos en segundo plano, con la misma imagen.
  chrono:
    image: openecoe/api:latest
    command: ["gunicorn", "-c", "configs/gunicorn_conf.py", "-w", "1", "--threads", "100", "--bind", "0.0.0.0:5001", "openecoe-chrono:app"]
    ports:
      - 5001:5001
    environment: *api-env
    depends_on:
      - api
  worker:
    image: openecoe/api:latest
    command: ["flask", "rq", "worker"]
    environment: *api-env
    depends_on:
      - api
