[project]
name = "openecoe-api"
version = "0.1.0"
description = ""
authors = [{ name = "Alberto Moreno", email = "amoreno@umh.es" }]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    # Flask y extensiones
    "flask (>=3.1,<4)",
    "flask-sqlalchemy (>=3.1,<4)",
    "flask-migrate (>=4.1,<5)",
    "flask-login (>=0.6.3,<0.7)",
    "flask-principal (==0.4.0)",
    "flask-httpauth (>=4.8,<5)",
    "flask-bcrypt (>=1.0.1,<2)",
    # bcrypt 5 da error con contraseñas de más de 72 bytes; la 4 las trunca, como la 3.1 que había antes.
    "bcrypt (>=4.3,<5)",
    "flask-cors (>=6.0,<7)",
    "flask-socketio (>=5.5,<6)",
    "simple-websocket (>=1.1,<2)",
    "python-dotenv (>=1.1,<2)",
    # Base de datos
    "sqlalchemy (>=2.1,<2.2)",
    "alembic (>=1.16,<2)",
    "pymysql (>=1.1,<2)",
    "cryptography (>=45)",
    # Trabajos en segundo plano
    "rq (>=2.12,<3)",
    "redis (>=6,<9)",
    # Estadísticas, exportaciones e informes
    "pandas (>=3.1,<4)",
    "openpyxl (>=3.1.5,<4)",  # pandas 3.1 la exige para read_excel y to_excel
    "pyexcel (>=0.7,<0.8)",
    "pyexcel-xlsx (>=0.6,<0.7)",
    "pyexcel-xls (>=0.7,<0.8)",
    "pyexcel-ods (>=0.6,<0.7)",
    "weasyprint (>=66)",
    # Dependencias de flask_potion (copiada en el repositorio, ver flask_potion/README.md)
    "jsonschema (>=4.23,<5)",
    "rfc3339-validator (>=0.1.4)",
    "aniso8601 (>=10,<11)",
    "six (>=1.17,<2)",
    # Servidor y utilidades
    "gunicorn (>=23)",
    "requests (>=2.32,<3)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-flask = "^1.3"
flake8 = "^7.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
